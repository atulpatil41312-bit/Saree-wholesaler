name: Deploy WholeMarket to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run a configured database backup, then apply pending migrations
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wholemarket-production
  cancel-in-progress: false

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  verify-and-package:
    name: Verify and package release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, gd, mbstring, pdo_pgsql, pdo_sqlite, zip
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Build production assets
        run: npm run build

      - name: Clear test configuration cache
        run: php artisan config:clear --ansi

      - name: Run application tests
        # Process isolation keeps image/GD tests from retaining state between
        # feature classes on the hosted runner.
        run: php artisan test --compact --process-isolation

      - name: Install production-only PHP dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Check tracked files for secrets
        shell: bash
        run: |
          set -Eeuo pipefail

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo 'A tracked .env file is not allowed.' >&2
            exit 1
          fi

          if git grep -n -I -E 'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{20,}' -- . ':!*.md'; then
            echo 'A possible credential was found in tracked source.' >&2
            exit 1
          fi

      - name: Assemble immutable release archive
        shell: bash
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          staging_dir="$(mktemp -d)"
          trap 'rm -rf "$staging_dir"' EXIT

          mkdir -p "$staging_dir/release"
          git archive --format=tar "$RELEASE_ID" | tar -xf - -C "$staging_dir/release"

          # vendor and public/build are generated by the verified build above.
          cp -a vendor "$staging_dir/release/vendor"
          mkdir -p "$staging_dir/release/public/build"
          cp -a public/build/. "$staging_dir/release/public/build/"

          # Runtime state is supplied by the server's shared directory and .env.
          rm -rf "$staging_dir/release/storage" "$staging_dir/release/.env"

          archive="$RUNNER_TEMP/wholemarket-${RELEASE_ID}.tar.gz"
          tar --sort=name --mtime='UTC 2024-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C "$staging_dir/release" .
          # Store only the archive basename so the checksum remains valid
          # after the artifact is downloaded into the deploy job's `release/`
          # directory instead of pointing at this runner's temp path.
          (cd "$(dirname "$archive")" && sha256sum "$(basename "$archive")") > "$archive.sha256"

      - name: Store release archive for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: wholemarket-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/wholemarket-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/wholemarket-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to DigitalOcean
    needs: verify-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_APP_ROOT: ${{ vars.DEPLOY_APP_ROOT }}
      DEPLOY_INBOX: ${{ vars.DEPLOY_INBOX }}
      DEPLOY_SCRIPT: ${{ vars.DEPLOY_SCRIPT || '/opt/wholemarket/bin/deploy-release' }}
      DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      # Optional passphrase for an encrypted deploy key. Keep this separate
      # from the private-key secret; the workflow never prints either value.
      DEPLOY_SSH_KEY_PASSPHRASE: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      RUN_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations || 'false' }}
    steps:
      - name: Download verified release archive
        uses: actions/download-artifact@v4
        with:
          name: wholemarket-release-${{ github.sha }}
          path: release

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          required=(DEPLOY_HOST DEPLOY_USER DEPLOY_APP_ROOT DEPLOY_INBOX DEPLOY_HEALTH_URL DEPLOY_SSH_PRIVATE_KEY DEPLOY_KNOWN_HOSTS)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub production environment value is missing: $name" >&2
              exit 1
            fi
          done

          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo 'DEPLOY_PORT must be numeric.' >&2; exit 1; }
          [[ "$RUN_MIGRATIONS" == 'true' || "$RUN_MIGRATIONS" == 'false' ]] || {
            echo 'RUN_MIGRATIONS must be true or false.' >&2
            exit 1
          }

      - name: Prepare SSH verification files
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          key_file="$RUNNER_TEMP/wholemarket-deploy-key"
          known_hosts_file="$RUNNER_TEMP/wholemarket-known-hosts"
          askpass_file="$RUNNER_TEMP/wholemarket-ssh-askpass"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"

          chmod 600 "$key_file" "$known_hosts_file"
          ssh-keygen -F "$DEPLOY_HOST" -f "$known_hosts_file" >/dev/null

          # Load the key into an ephemeral ssh-agent so both later steps can
          # use encrypted and unencrypted keys without exposing a passphrase
          # on a command line or in logs.
          cat > "$askpass_file" <<'EOF'
          #!/usr/bin/env bash
          printf '%s' "${DEPLOY_SSH_KEY_PASSPHRASE:-}"
          EOF
          chmod 700 "$askpass_file"

          eval "$(ssh-agent -s)"
          export SSH_ASKPASS="$askpass_file"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0
          if ! ssh-add "$key_file" </dev/null; then
            if [[ -z "${DEPLOY_SSH_KEY_PASSPHRASE:-}" ]]; then
              echo 'The deploy key is encrypted. Add the DEPLOY_SSH_KEY_PASSPHRASE production secret.' >&2
            else
              echo 'The deploy key could not be unlocked with DEPLOY_SSH_KEY_PASSPHRASE.' >&2
            fi
            exit 1
          fi

          # Persist only agent metadata and file paths between steps. The
          # private key and passphrase remain in the runner's protected temp
          # directory and are never written to the repository or job output.
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
            echo "SSH_ASKPASS=$askpass_file"
            echo 'SSH_ASKPASS_REQUIRE=force'
            echo 'DISPLAY=:0'
          } >> "$GITHUB_ENV"

          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          echo "known_hosts_file=$known_hosts_file" >> "$GITHUB_OUTPUT"

      - name: Upload release archive
        shell: bash
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          archive="release/wholemarket-${RELEASE_ID}.tar.gz"
          checksum="release/wholemarket-${RELEASE_ID}.tar.gz.sha256"
          test -f "$archive" && test -f "$checksum"
          (cd release && sha256sum --check "$(basename "$checksum")")

          scp \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=no \
            -o IdentityAgent="$SSH_AUTH_SOCK" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${{ steps.ssh.outputs.known_hosts_file }}" \
            -o ConnectTimeout=15 \
            "$archive" \
            "$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_INBOX%/}/"

      - name: Activate release and verify health
        shell: bash
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          remote_archive="${DEPLOY_INBOX%/}/wholemarket-${RELEASE_ID}.tar.gz"
          printf -v remote_command '%q ' \
            bash "$DEPLOY_SCRIPT" \
            --archive "$remote_archive" \
            --release "$RELEASE_ID" \
            --app-root "$DEPLOY_APP_ROOT" \
            --health-url "$DEPLOY_HEALTH_URL" \
            --run-migrations "$RUN_MIGRATIONS"

          ssh \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=no \
            -o IdentityAgent="$SSH_AUTH_SOCK" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${{ steps.ssh.outputs.known_hosts_file }}" \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_command"

          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 20 "$DEPLOY_HEALTH_URL" >/dev/null

      - name: Refresh PHP OPcache after release switch
        shell: bash
        run: |
          set -Eeuo pipefail

          refresh_token="$(openssl rand -hex 32)"
          health_host="${DEPLOY_HEALTH_URL#https://}"
          health_host="${health_host%%/*}"

          ssh \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=no \
            -o IdentityAgent="$SSH_AUTH_SOCK" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${{ steps.ssh.outputs.known_hosts_file }}" \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s' <<REMOTE_SCRIPT
          set -Eeuo pipefail
          umask 077
          capability_path="${DEPLOY_APP_ROOT%/}/shared/.opcache-refresh"
          printf '%s' '$refresh_token' > "\$capability_path"
          trap 'rm -f -- "\$capability_path"' EXIT
          curl --fail --silent --show-error --max-time 20 \
            --resolve '$health_host:443:127.0.0.1' \
            -H 'X-WholeMarket-Refresh: $refresh_token' \
            'https://$health_host/opcache-refresh.php'
          REMOTE_SCRIPT
